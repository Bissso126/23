name: Sauvegarde Turso

on:
  schedule:
    # Tous les jours à 03:17 UTC. Les fichiers restent dans les artifacts
    # GitHub (90 jours, accessibles uniquement aux personnes autorisées).
    # ⚠️ Ne jamais committer de .db dans ce dépôt : il est public.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export SQLite de la base Turso
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm ci

      - name: Export de la base
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
        run: |
          mkdir -p backups
          node scripts/backup-export.js "backups/ass-$(date -u +%F).db"

      - name: Archive (rétention 90 jours)
        uses: actions/upload-artifact@v4
        with:
          name: ass-backup-${{ github.run_id }}
          path: backups/ass-*.db
          retention-days: 90
          if-no-files-found: error

      # Aucune publication git : le dépôt est public et une sauvegarde
      # contiendrait les hash de mots de passe et les jetons de session.
      # Pour une conservation > 90 jours, déposer l'artifact dans un
      # stockage privé (S3/R2/GDrive) ou un dépôt privé dédié.
