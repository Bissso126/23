services:
  - type: web
    name: ass-erp
    runtime: node
    # Plan gratuit : plus besoin de disque persistant, la base vit sur Turso.
    plan: free
    region: frankfurt
    buildCommand: npm ci
    startCommand: node server.js
    autoDeployTrigger: commit
    envVars:
      # Render impose une écoute sur 0.0.0.0 ; PORT est fourni par Render.
      - key: HOST
        value: 0.0.0.0
      # Pas de comptes de démonstration sur un serveur public.
      - key: SEED_DEMO
        value: "0"
      - key: ADMIN_EMAIL
        value: admin@ass.dz
      # À saisir dans le tableau de bord Render (valeurs secrètes, jamais dans le dépôt).
      - key: ADMIN_PASSWORD
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      # Base Turso Cloud (gratuite) : voir README-RENDER.md.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
